# Limites e cache de borda do AfroRetratos.
# Instale em /etc/nginx/conf.d/afroretratos-limits.conf (contexto http).

# Micro-cache: segura o trafego repetido (bots, crawlers, F5) antes de chegar na
# aplicacao. Sem isso, cada leitura de pagina acorda o Neon e consome CU-h do
# plano free, entao o cache aqui e tambem uma protecao de cota.
proxy_cache_path /var/cache/nginx/afro levels=1:2 keys_zone=afro_cache:10m max_size=200m inactive=10m use_temp_path=off;

# Lista de redes do Cloudflare usada como allowlist no server block. Gerada
# por refresh-cloudflare-ips.sh.
include /etc/nginx/cloudflare-geo.conf;

# O IP ja chega resolvido pelo real_ip_header (CF-Connecting-IP) no server block.
limit_req_zone $binary_remote_addr zone=afro_site:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=afro_api:10m rate=2r/s;

# Crawlers de SEO e bibliotecas de scraping que so geram custo. Googlebot e
# Bingbot ficam de fora de proposito.
map $http_user_agent $afro_bad_agent {
    default 0;
    ~*ahrefs          1;
    ~*semrush         1;
    ~*mj12bot         1;
    ~*dotbot          1;
    ~*petalbot        1;
    ~*bytespider      1;
    ~*dataforseo      1;
    ~*serpstat        1;
    ~*screamingfrog   1;
    ~*python-requests 1;
    ~*python-urllib   1;
    ~*scrapy          1;
    ~*go-http-client  1;
    ~*zgrab           1;
    ~*masscan         1;
}
