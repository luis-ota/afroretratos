# /etc/nginx/sites-available/afroretratos.wired.rs
#
# A origem so aceita trafego do Cloudflare (allowlist em
# /etc/nginx/cloudflare-ips.conf). Com isso o cabecalho cf-connecting-ip passa
# a ser confiavel, o $remote_addr vira o visitante de verdade e ninguem
# consegue forjar IP batendo direto no IP da VPS.
#
# O micro-cache (afro_cache) e o limit_req vivem em
# /etc/nginx/conf.d/afroretratos-limits.conf.

server {
    listen 80;
    listen [::]:80;
    server_name afroretratos.wired.rs;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name afroretratos.wired.rs;

    ssl_certificate     /etc/ssl/cert.pem;
    ssl_certificate_key /etc/ssl/key.pem;

    include /etc/nginx/cloudflare-ips.conf;
    deny all;

    real_ip_header CF-Connecting-IP;

    # Log proprio: o fail2ban le so este arquivo, onde o IP logado ja e o do
    # visitante (nos outros sites da VPS o log guarda o IP do Cloudflare).
    access_log /var/log/nginx/afroretratos.access.log;
    error_log  /var/log/nginx/afroretratos.error.log;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    if ($afro_bad_agent) {
        return 444;
    }

    # Alvos classicos de scanner. Retorna 444 (fecha a conexao sem resposta).
    location ~* /(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|\.env|\.git|\.aws|\.ssh) {
        return 444;
    }

    # Nada de cache para quem escreve, para o admin ou para requisicao com
    # cookie/authorization.
    set $afro_no_cache 0;
    if ($request_method !~ ^(GET|HEAD)$) { set $afro_no_cache 1; }
    if ($http_cookie ~* "afroretratos_admin") { set $afro_no_cache 1; }
    if ($http_authorization) { set $afro_no_cache 1; }

    location ^~ /admin {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=afro_api burst=8 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache afro_cache;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 15s;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_bypass $afro_no_cache;
        proxy_no_cache $afro_no_cache;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=afro_site burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache afro_cache;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 30s;
        proxy_cache_valid 404 10s;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_bypass $afro_no_cache;
        proxy_no_cache $afro_no_cache;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_read_timeout 30s;
    }
}
