# /etc/nginx/sites-available/afroretratos.wired.rs
#
# A origem so aceita trafego do Cloudflare (allowlist em
# /etc/nginx/cloudflare-ips.conf). Com isso o cabecalho cf-connecting-ip passa
# a ser confiavel e ninguem consegue forjar IP batendo direto no IP da VPS.

server {
    listen 80;
    listen [::]:80;
    server_name afroretratos.wired.rs;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name afroretratos.wired.rs;

    ssl_certificate     /etc/ssl/cert.pem;
    ssl_certificate_key /etc/ssl/key.pem;

    include /etc/nginx/cloudflare-ips.conf;
    deny all;

    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
