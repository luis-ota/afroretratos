name: afroretratos

services:
  db:
    image: postgres:16-alpine
    labels:
      security-watch:
    image: ghcr.io/luis-ota/afroretratos-watch:latest
    restart: always
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    # root apenas para ler /var/log/messages (640 root:wheel); so leitura.
    user: "0:0"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TZ: America/Sao_Paulo
    volumes:
      - /var/log:/host/log:ro
      - /:/host/root:ro
      - /proc:/host/proc:ro

  autoheal: "true"
    restart: always
    environment:
      POSTGRES_USER: afro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: afroretratos
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
    volumes:
      - afro-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afro -d afroretratos"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    labels:
      security-watch:
    image: ghcr.io/luis-ota/afroretratos-watch:latest
    restart: always
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    # root apenas para ler /var/log/messages (640 root:wheel); so leitura.
    user: "0:0"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TZ: America/Sao_Paulo
    volumes:
      - /var/log:/host/log:ro
      - /:/host/root:ro
      - /proc:/host/proc:ro

  autoheal: "true"
    restart: always
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - afro-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/luis-ota/afroretratos:latest
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      security-watch:
    image: ghcr.io/luis-ota/afroretratos-watch:latest
    restart: always
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    # root apenas para ler /var/log/messages (640 root:wheel); so leitura.
    user: "0:0"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TZ: America/Sao_Paulo
    volumes:
      - /var/log:/host/log:ro
      - /:/host/root:ro
      - /proc:/host/proc:ro

  autoheal: "true"
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://afro:${POSTGRES_PASSWORD}@db:5432/afroretratos
      REDIS_URL: redis://redis:6379
      ORIGIN_HASH_SECRET: ${ORIGIN_HASH_SECRET}
      ORIGIN_ENCRYPTION_KEY: ${ORIGIN_ENCRYPTION_KEY}
      ADMIN_SECRET: ${ADMIN_SECRET}
      TRUSTED_PROXY_HOPS: "1"
      TRUST_CLOUDFLARE_HEADER: "false"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NODE_OPTIONS: --max-old-space-size=320
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/api/posts || exit 1
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 25s

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    network_mode: host
    # O certificado e as credenciais ficam em ~/.cloudflared (600/400); o
    # usuario nonroot da imagem nao consegue ler o volume somente-leitura.
    user: "0:0"
    command: tunnel --config /etc/cloudflared/tunnel.yml run afroretratos
    volumes:
      - /home/luis/.cloudflared:/etc/cloudflared:ro

  security-watch:
    image: ghcr.io/luis-ota/afroretratos-watch:latest
    restart: always
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    # root apenas para ler /var/log/messages (640 root:wheel); so leitura.
    user: "0:0"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TZ: America/Sao_Paulo
    volumes:
      - /var/log:/host/log:ro
      - /:/host/root:ro
      - /proc:/host/proc:ro

  autoheal:
    image: willfarrell/autoheal:latest
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: always
    environment:
      DOCKER_API_VERSION: "1.40"
    command: --label-enable --cleanup --interval 180
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  afro-db:
  afro-redis:
